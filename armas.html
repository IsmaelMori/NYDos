<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armas | NYDo Wiki</title>

    <!-- CSS GENERAL -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="jutsus.css">
    <link rel="stylesheet" href="busqueda.css">
    <link rel="stylesheet" href="armas.css">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="mobile-nav.css">

    <style>
        html { scroll-behavior: smooth; }

        /* ---------- TOPBAR (glass) ---------- */
        .nydo-header { position: sticky; top: 0; z-index: 1000; }
        .topbar {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 20px;
            background: rgba(8, 11, 18, .78) !important;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229, 9, 32, .3);
        }

        /* ---------- BUSCADOR ---------- */
        .wiki-search-wrap { flex: 1; max-width: 420px; margin: 0 auto; position: relative; }
        .wiki-search-box {
            display: flex;
            align-items: center;
            padding: 5px 14px;
            background: rgba(19, 23, 34, .7);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, .4);
            transition: border-color .2s, box-shadow .2s;
        }
        .wiki-search-box:focus-within { border-color: #e50920; box-shadow: 0 0 10px rgba(229, 9, 32, .3); }
        .wiki-search-icon { margin-right: 10px; font-size: 14px; color: #ff5265; }
        #wikiSearchInput {
            width: 100%;
            font: inherit;
            font-size: 13px;
            color: #eee2c9;
            background: transparent;
            border: 0;
            outline: 0;
        }
        #wikiSearchInput::placeholder { color: #8d98aa; opacity: .8; }
        #wikiSearchClear { padding: 2px 5px; font-size: 14px; color: #8d98aa; background: transparent; border: 0; cursor: pointer; }
        #wikiSearchClear:hover { color: #fff; }
        .wiki-search-results {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            z-index: 1100;
            max-height: 320px;
            overflow-y: auto;
            background: rgba(14, 18, 28, .96);
            border: 1px solid rgba(229, 9, 32, .4);
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .7);
        }
        .wiki-search-result {
            display: block;
            padding: 11px 14px;
            color: #eee2c9;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            transition: background .15s;
        }
        .wiki-search-result:last-child { border-bottom: 0; }
        .wiki-search-result:hover { background: rgba(229, 9, 32, .15); }
        .wiki-search-result-page { display: block; margin-bottom: 3px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #ff5265; }
        .wiki-search-result-title { display: block; font-size: 13px; font-weight: 700; color: #f4f5fa; }
        .wiki-search-result-description { display: block; margin-top: 3px; overflow: hidden; font-size: 11px; color: #a5adbd; white-space: nowrap; text-overflow: ellipsis; }
        .wiki-search-empty { padding: 14px; font-size: 12px; text-align: center; color: #a5adbd; }

        /* ---------- PANELES ----------
           content-visibility evita pintar las secciones que aún no se ven */
        .jutsu-panel {
            background: linear-gradient(160deg, rgba(20, 25, 38, .78), rgba(11, 14, 22, .78)) !important;
            border: 1px solid rgba(255, 255, 255, .08) !important;
            border-radius: 22px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .06);
            scroll-margin-top: 90px;
            content-visibility: auto;
            contain-intrinsic-size: auto 520px;
        }
        .category-nav a { transition: transform .2s ease, color .2s ease, border-color .2s ease; }
        .category-nav a:hover { transform: translateY(-2px); }

        /* ---------- TARJETAS DE ELEMENTOS ---------- */
        .element-grid { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
        .element-card { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
        .element-card:hover { transform: translateY(-4px); }
        .element-card.ninja { --ninja: #4fb3ff; }
        .element-card.ninja:hover { border-color: var(--ninja); box-shadow: 0 10px 25px rgba(79, 179, 255, .18); }
        .element-card.ninja .element-symbol { display: inline-grid; place-items: center; }
        .element-card.ninja .element-symbol img { width: 46px; height: 46px; image-rendering: pixelated; filter: brightness(3.2) contrast(1.1); }
        .element-card.ninja .element-name { color: var(--ninja); }

        /* ---------- BOTÓN TEMÁTICO: KEKKEI GENKAI ---------- */
        .kg-teaser {
            --a: #5fcf7a;
            --b: #9b4dff;
            --c: #ffb347;
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 22px;
            margin-top: 8px;
            padding: 24px 26px;
            overflow: hidden;
            color: #f4f5fa;
            text-decoration: none;
            isolation: isolate;
            background:
                radial-gradient(70% 140% at 0% 0%, rgba(95, 207, 122, .2), transparent 60%),
                radial-gradient(70% 140% at 100% 100%, rgba(155, 77, 255, .22), transparent 60%),
                linear-gradient(135deg, #141a2a, #0b0e18);
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 22px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .2);
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .kg-teaser::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 3px;
            background: linear-gradient(90deg, var(--a), var(--b), var(--c));
        }
        .kg-teaser:hover,
        .kg-teaser:focus-visible {
            transform: translateY(-3px);
            outline: 0;
            border-color: rgba(255, 255, 255, .45);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .5), 0 0 30px rgba(155, 77, 255, .25);
        }
        .kg-teaser-icon {
            display: grid;
            place-items: center;
            width: 70px;
            height: 70px;
            font-size: 30px;
            color: #fff;
            background: linear-gradient(135deg, var(--a), var(--b));
            border-radius: 20px;
            box-shadow: 0 0 24px rgba(155, 77, 255, .45);
        }
        .kg-teaser-eyebrow { display: block; font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--c); }
        .kg-teaser h3 { margin: 4px 0 6px; font-size: 23px; line-height: 1.2; color: #fff; }
        .kg-teaser p { margin: 0; font-size: 13px; line-height: 1.65; color: #b6bfd0; }
        .portal-kg { margin-top: 8px; }
        .kg-glyphs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .kg-glyphs span {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            font-size: 15px;
            font-weight: 700;
            color: var(--g);
            background: rgba(255, 255, 255, .05);
            border: 1px solid color-mix(in srgb, var(--g) 45%, transparent);
            border-radius: 9px;
        }
        .kg-teaser-go {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 800;
            color: #11141d;
            white-space: nowrap;
            background: linear-gradient(135deg, #f2d08f, #e7b66d);
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(231, 182, 109, .3);
        }
        .kg-teaser-go i { transition: transform .25s ease; }
        .kg-teaser:hover .kg-teaser-go i { transform: translateX(4px); }

        /* ---------- RESPONSIVO ---------- */
        @media (max-width: 720px) {
            .topbar { padding: 8px 12px; gap: 10px; }
            .kg-teaser { grid-template-columns: auto 1fr; padding: 20px 18px; gap: 16px; }
            .kg-teaser-icon { width: 56px; height: 56px; font-size: 24px; border-radius: 16px; }
            .kg-teaser h3 { font-size: 20px; }
            .kg-teaser-go { grid-column: 1 / -1; justify-content: center; }
        }
        @media (hover: none) {
            a.sage-card.sage-link:hover,
            .element-card:hover,
            .kg-teaser:hover { transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; animation: none !important; }
        }

        /* ---------- GUÍA (nube de sugerencias) ---------- */
        #guiaNube { position: absolute; z-index: 99999; width: 290px; max-width: calc(100vw - 30px); pointer-events: none; transition: top .35s ease, left .35s ease; }
        #guiaMensaje {
            position: relative;
            padding: 20px;
            color: #fff;
            background: rgba(15, 23, 42, .94);
            border: 1px solid rgba(231, 182, 109, .8);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            pointer-events: auto;
            animation: guiaEntrada .3s ease;
        }
        #guiaNumero { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #e7b66d; }
        #guiaTitulo { margin: 10px 0; font-size: 21px; color: #fff; }
        #guiaTexto { margin: 0; font-size: 13px; line-height: 1.7; color: #e2e8f0; }
        .guiaAcciones { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 17px; }
        .guiaAcciones button { padding: 9px 13px; font-size: 12px; border: 0; border-radius: 8px; cursor: pointer; }
        #guiaSaltar { color: #cbd5e1; background: transparent; }
        #guiaSiguiente { font-weight: 700; color: #111827; background: #e7b66d; }
        #guiaFlecha {
            position: absolute;
            display: none;
            width: 17px;
            height: 17px;
            background: rgba(15, 23, 42, .94);
            border-top: 1px solid rgba(231, 182, 109, .8);
            border-left: 1px solid rgba(231, 182, 109, .8);
            transform: rotate(45deg);
            pointer-events: none;
        }
        .guia-destacada { position: relative; z-index: 99998 !important; outline: 2px solid #e7b66d !important; outline-offset: 5px; border-radius: 8px; scroll-margin-top: 100px; }
        @keyframes guiaEntrada { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 480px) { #guiaNube { width: 260px; } }
    </style>
</head>

<script>
(() => {
const S='fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const ART={
kunai:`<g ${S}><path d="M100 14 128 76 100 112 72 76Z" fill="currentColor" fill-opacity=".15"/><path d="M100 112v44"/><circle cx="100" cy="170" r="14"/></g>`,
shuriken:`<g ${S}><path d="M100 14 118 82 186 100 118 118 100 186 82 118 14 100 82 82Z" fill="currentColor" fill-opacity=".15"/><circle cx="100" cy="100" r="9"/></g>`,
sword:`<g ${S}><path d="M100 10 112 40V120H88V40Z" fill="currentColor" fill-opacity=".15"/><path d="M68 120h64"/><path d="M100 120v52"/><path d="M92 150h16M92 162h16"/></g>`,
big:`<g ${S}><path d="M84 10H132V130H84Z" fill="currentColor" fill-opacity=".15"/><path d="M60 130h112"/><path d="M108 130v46"/></g>`,

needle:`<g ${S}><path d="M40 160 160 40"/><path d="M60 170 170 60" opacity=".6"/><path d="M30 140 140 30" opacity=".6"/></g>`,
claw:`<g ${S}><path d="M60 20 74 110M100 14 100 110M140 20 126 110" /><path d="M54 110h92v40H54Z" fill="currentColor" fill-opacity=".15"/></g>`,
staff:`<g ${S}><path d="M100 10v180"/><path d="M88 10h24M88 190h24"/></g>`,
drill:`<g ${S}><path d="M100 10 136 150H64Z" fill="currentColor" fill-opacity=".15"/><path d="M84 110h32M90 80h20M78 140h44"/><path d="M100 150v30"/></g>`,
axe:`<g ${S}><path d="M100 14v170"/><path d="M100 30C50 30 40 80 52 110 80 100 100 90 100 90Z" fill="currentColor" fill-opacity=".15"/><path d="M100 50h26v36h-26Z"/></g>`,
twin:`<g ${S}><path d="M70 14 82 110H58Z M130 14 142 110H118Z" fill="currentColor" fill-opacity=".15"/><path d="M70 110v60M130 110v60"/></g>`
};
// Pega aquí la URL de la imagen de cada arma (https://... o una ruta como img/armas/kunai.png).

const IMG={

  'Fūma Shuriken':'',

  'Kunai del Dios del Trueno Volador':'',
  'Kunai explosivo':'',
  'Kunai Blade':'',
  'Senbon':'',

  'Senbon de hielo':'',
  'Cañón de brazo Senbon':'',
  'Kusanagi':'',
  'Kubikiribōchō':'',
  'Samehada':'',
  'Espada de Totsuka':'',
  'Hiramekarei':'',
  'Nuibari':'',
  'Shibuki':'',

// recipe: grid (9 celdas) o list (sin forma fija); out = unidades
const Fe='Lingote de hierro',Nug='Pepita de hierro';
const W=[
// 0 = armas ninja, 1 = espadas legendarias, 2 = otras armas
[0,'Kunai','kunai','Arma arrojadiza básica. Sirve para atacar a distancia.','+4',{grid:['',Fe,'','',Fe,'','Hilo',Fe,'Hilo'],out:3}],

[0,'Kunai de tres puntas','kunai','Kunai especial del estilo de combate de Minato.','+4'],

[0,'Senbon','needle','Agujas ninja arrojadizas.','Por verificar',{grid:[Fe,'','','',Fe,'','','',Fe],out:32}],

[2,'Scythe de Madara','scythe','Guadaña de Madara.','+14'],
[2,'Espadas Raiton Supervibrato','twin','Espadas del elemento Raiton.',null],
[2,'Kris Blades','twin','Hojas Kris manifestadas mediante habilidades.',null],
[2,'Espada ANBU','sword','Espada de combate de los ANBU.',null],
[2,'Hacha Senninka','axe','Hacha de combate.','+8']

const pic=w=>IMG[w[1]]?`<img src="${IMG[w[1]]}" alt="${w[1]}" data-t="${w[2]}" loading="lazy" referrerpolicy="no-referrer">`:art(w[2]);
document.addEventListener('error',e=>{const el=e.target;if(el.tagName==='IMG'&&el.dataset.t)el.outerHTML=art(el.dataset.t)},true);
const CATS=['Armas ninja','Espadas legendarias','Otras armas'];
let cat=-1,list=W,i=0;
const $=id=>document.getElementById(id);
const page=$('armasPage');

function setCat(c){
  cat=c;list=c<0?W:W.filter(w=>w[0]===c);i=0;
  $('tabs').innerHTML=['Todas',...CATS].map((n,k)=>`<button type="button" aria-pressed="${k-1===c}" data-c="${k-1}">${n}</button>`).join('');
  $('shelf').innerHTML=list.map((w,k)=>`<button type="button" data-i="${k}" title="${w[1]}" aria-label="${w[1]}">${pic(w)}</button>`).join('');
  show();
}
function show(){
  const [wc,name,type,desc,dmg,rec]=list[i];
  page.dataset.cat=wc;
  $('view').innerHTML=`<div class="count">${i+1} de ${list.length}</div><div class="orb swap">${pic(list[i])}</div><h2>${name}</h2><p>${desc}</p>`
    +(dmg?`<div class="dmg ${/^\+|^\d/.test(dmg)?'has':''}">Daño: ${dmg}</div>`:'');
  let c='<h3 class="craft-title">Crafteo</h3>';
  if(!rec) c+='<span class="none">Sin receta encontrada</span>';
  else{
    c+=rec.grid
      ?`<div class="grid">${rec.grid.map(x=>`<div class="${x?'f':''}">${x}</div>`).join('')}</div>`
      :`<ul class="list">${rec.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    c+=`<div class="res"><b>× ${rec.out}</b>${rec.grid?'':'sin forma fija'}</div>`;
  }
  $('craft').innerHTML=c;
  [...$('shelf').children].forEach((b,k)=>{b.setAttribute('aria-current',k===i);if(k===i)b.scrollIntoView({block:'nearest',inline:'center'})});
}
const go=d=>{i=(i+d+list.length)%list.length;show()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)setCat(+b.dataset.c)};
$('shelf').onclick=e=>{const b=e.target.closest('button');if(b){i=+b.dataset.i;show()}};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input'))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
// brillo especular que sigue al puntero
document.querySelectorAll('.glass').forEach(g=>g.addEventListener('pointermove',e=>{
  const r=g.getBoundingClientRect();
  g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px');
}));
setCat(-1);
})();
</script>
<script src="translate.js" defer></script>
<script src="mobile-nav.js" defer></script>
</body>
</html>
